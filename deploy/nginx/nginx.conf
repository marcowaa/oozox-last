# OOZOX Production Nginx Reverse Proxy Configuration
# Domains handled:
#   - oozox.com / www / admin -> Containerized React/Vite Web Portal (web:80) + API (/api/)
#   - api.oozox.com           -> Express API (api:5000)
#   - signaling.oozox.com     -> Go WebRTC Signaling + WebSocket (signaling:8080)

limit_req_zone $binary_remote_addr zone=otp_limit:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=trusted_login_limit:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=60r/m;
limit_conn_zone $binary_remote_addr zone=addr_conn:10m;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# HTTP -> HTTPS redirect + Let's Encrypt ACME challenge
server {
    listen 80;
    listen [::]:80;
    server_name oozox.com www.oozox.com admin.oozox.com api.oozox.com signaling.oozox.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 1. Public Web Portal & Admin Dashboard (https://oozox.com)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name oozox.com www.oozox.com admin.oozox.com;

    ssl_certificate     /etc/letsencrypt/live/oozox.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/oozox.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    limit_conn addr_conn 30;
    client_max_body_size 1m;
    client_body_timeout 15s;
    client_header_timeout 15s;
    send_timeout 30s;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://api.oozox.com wss://signaling.oozox.com https://signaling.oozox.com; media-src 'self' blob:; frame-ancestors 'self';" always;
    add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=(self), payment=(), usb=()" always;

    # Strict OTP endpoint rate limiting
    location ^~ /api/auth/otp/ {
        limit_req zone=otp_limit burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://api:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 15s;
        proxy_read_timeout 60s;
    }

    # Strict trusted-device biometric login rate limiting
    location = /api/auth/trusted-login {
        limit_req zone=trusted_login_limit burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://api:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 15s;
        proxy_read_timeout 60s;
    }

    # AI vision payloads up to 4MB
    location ^~ /api/ai/ {
        limit_req zone=api_limit burst=20 nodelay;
        limit_req_status 429;
        client_max_body_size 4m;
        proxy_pass http://api:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 15s;
        proxy_read_timeout 60s;
    }

    # Larger payload allowance strictly for encrypted vault snapshots and cross-device media chunks
    location ~ ^/api/(backups|transfer) {
        limit_req zone=api_limit burst=20 nodelay;
        limit_req_status 429;
        client_max_body_size 20m;
        proxy_pass http://api:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 15s;
        proxy_read_timeout 120s;
    }

    # Allow same-origin /api calls from the web portal directly to the API container
    location /api/ {
        limit_req zone=api_limit burst=40 nodelay;
        limit_req_status 429;
        proxy_pass http://api:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 15s;
        proxy_read_timeout 60s;
    }

    location / {
        proxy_pass http://web:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# 2. Core REST API (https://api.oozox.com)
server {
