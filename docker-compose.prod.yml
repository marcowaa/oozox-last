services:
  mongo:
    image: mongo:7.0
    container_name: oozox_mongo_prod
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:?MONGO_ROOT_USER is required}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?MONGO_ROOT_PASSWORD is required}
      MONGO_INITDB_DATABASE: ${MONGO_DB_NAME:-oozox_prod_db}
      MONGO_APP_USER: ${MONGO_APP_USER:-oozox_app}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD:?MONGO_APP_PASSWORD is required}
    volumes:
      - oozox_mongo_data:/data/db
      - oozox_mongo_config:/data/configdb
      - ./deploy/mongo/init-app-user.sh:/docker-entrypoint-initdb.d/init-app-user.sh:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--username", "${MONGO_ROOT_USER}", "--password", "${MONGO_ROOT_PASSWORD}", "--authenticationDatabase", "admin", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    networks:
      - oozox_data_internal

  redis:
    image: redis:7-alpine
    container_name: oozox_redis_prod
    restart: always
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      - --appendonly
      - "yes"
      - --maxmemory
      - 512mb
      - --maxmemory-policy
      - volatile-lru
    volumes:
      - oozox_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - oozox_data_internal

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: oozox_api_prod
    restart: always
    environment:
      PORT: 5000
      NODE_ENV: production
      TRUST_PROXY_HOPS: 1
      API_RATE_LIMIT_MAX: ${API_RATE_LIMIT_MAX:-500}
      MONGO_URI: mongodb://${MONGO_APP_USER:-oozox_app}:${MONGO_APP_PASSWORD}@mongo:27017/${MONGO_DB_NAME:-oozox_prod_db}?authSource=${MONGO_DB_NAME:-oozox_prod_db}
      DB_ENCRYPTION_KEY: ${DB_ENCRYPTION_KEY:?DB_ENCRYPTION_KEY is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:?CLIENT_ORIGIN is required}
      OTP_HMAC_SECRET: \${OTP_HMAC_SECRET:?OTP_HMAC_SECRET is required}
      OTP_TTL_SECONDS: \${OTP_TTL_SECONDS:-300}
      OTP_RESEND_COOLDOWN_SECONDS: \${OTP_RESEND_COOLDOWN_SECONDS:-60}
      OTP_MAX_ATTEMPTS: \${OTP_MAX_ATTEMPTS:-5}
      OTP_REQUEST_RATE_LIMIT_MAX: \${OTP_REQUEST_RATE_LIMIT_MAX:-8}
      OTP_VERIFY_RATE_LIMIT_MAX: \${OTP_VERIFY_RATE_LIMIT_MAX:-20}
      TWILIO_ACCOUNT_SID: \${TWILIO_ACCOUNT_SID:-}
      TWILIO_API_KEY_SID: \${TWILIO_API_KEY_SID:-}
      TWILIO_API_KEY_SECRET: \${TWILIO_API_KEY_SECRET:-}
      TWILIO_VERIFY_SERVICE_SID: \${TWILIO_VERIFY_SERVICE_SID:-}
      TELEGRAM_BOT_TOKEN: \${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_BOT_USERNAME: \${TELEGRAM_BOT_USERNAME:-}
      TELEGRAM_WEBHOOK_SECRET: \${TELEGRAM_WEBHOOK_SECRET:-}
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 15s
    networks:
      - oozox_data_internal
      - oozox_edge

  signaling:
    build:
      context: ./backend-signaling
      dockerfile: Dockerfile
    container_name: oozox_signaling_prod
    restart: always
    environment:
      PORT: 8080
      APP_ENV: production
      AUTH_TOKEN_ENABLED: "false"
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_DB: 0
      JWT_SECRET: ${JWT_SECRET}
      COTURN_SECRET: ${COTURN_SECRET:?COTURN_SECRET is required}
      TURN_URLS: ${TURN_URLS:?TURN_URLS is required}
      TURN_TTL: ${TURN_TTL:-3600}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:?ALLOWED_ORIGINS is required}
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 10s
    networks:
      - oozox_data_internal
      - oozox_edge

  web:
    build:
      context: .
      dockerfile: deploy/web/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-https://api.oozox.com}
    container_name: oozox_web_prod
    restart: always
    networks:
      - oozox_edge

  nginx:
    image: nginx:1.27-alpine
    container_name: oozox_nginx_prod
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    depends_on:
      api:
        condition: service_healthy
      signaling:
        condition: service_healthy
      web:
        condition: service_healthy
    networks:
      - oozox_edge

  certbot:
    image: certbot/certbot:latest
    profiles: ["certbot"]
    ports:
      - "80:80"
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt
      - /var/www/certbot:/var/www/certbot

  coturn:
    image: coturn/coturn:4.6-alpine
    container_name: oozox_coturn_prod
    restart: always
    network_mode: host
    command:
      - -c
      - /etc/coturn/turnserver.conf
      - --static-auth-secret=${COTURN_SECRET}
      - --realm=${TURN_REALM:-turn.oozox.com}
      - --external-ip=${SERVER_PUBLIC_IP:?SERVER_PUBLIC_IP is required}
    volumes:
      - ./deploy/coturn/turnserver.conf:/etc/coturn/turnserver.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro

volumes:
  oozox_mongo_data:
    name: oozox_mongo_data
  oozox_mongo_config:
    name: oozox_mongo_config
  oozox_redis_data:
    name: oozox_redis_data

networks:
  oozox_data_internal:
    name: oozox_data_internal
    driver: bridge
    internal: true
  oozox_edge:
    name: oozox_edge
    driver: bridge
