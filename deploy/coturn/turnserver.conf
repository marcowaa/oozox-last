# OOZOX Production Coturn STUN/TURN Configuration
listening-port=3478
tls-listening-port=5349
cert=/etc/letsencrypt/live/turn.oozox.com/fullchain.pem
pkey=/etc/letsencrypt/live/turn.oozox.com/privkey.pem

# Ephemeral REST API shared-secret authentication (matched with Go signaling COTURN_SECRET)
use-auth-secret

# Media relay port range (must be allowed through firewall UDP 49152-65535)
min-port=49152
max-port=65535

fingerprint
no-multicast-peers
no-loopback-peers
stale-nonce=600
total-quota=100
bps-capacity=0
simple-log

# Prometheus relay metrics exporter (port 9641; keep firewalled to host/docker bridge only, never expose publicly)
prometheus
